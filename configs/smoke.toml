run_dir = "runs/smoke-rectified-lpjepa-v4"
activation_dir = "data/smoke-exchangeable-v3"

[model]
name = "EleutherAI/pythia-70m-deduped"
revision = "step143000"
layer = 3
dtype = "bfloat16"

[data]
dataset = "EleutherAI/the_pile_deduplicated"
dataset_config = "default"
revision = "fcbfcfde4222cbb1acd1d33bad0be250ee14b1bb"
split = "train"
text_field = "text"
sequence_length = 64
min_valid_tokens = 64
burn_in_tokens = 32
train_sequences = 256
validation_sequences = 32
shard_sequences = 32
extraction_batch_size = 16
validation_fraction = 0.1
shuffle_buffer = 1000

[sae]
dictionary_size = 2048
k = 20
high_fraction = 0.2
temporal_alpha = 1.0
contrastive_temperature = 1.0
high_reconstruction_weight = 0.2
full_reconstruction_weight = 0.8
auxiliary_weight = 0.03125
threshold_beta = 0.999
dead_token_threshold = 100000

[train]
seed = 42
standard_steps = 20
branch_steps = 20
token_batch_size = 128
temporal_pairs_per_step = 112
window_batch_size = 8
gradient_accumulation_steps = 1
standard_lr = 0.0002
temporal_lr = 0.0002
proposal_sae_lr = 0.0001
warmup_steps = 2
gradient_clip = 1.0
log_every = 5
amp_dtype = "bfloat16"
device = "cuda"

[proposal]
window_size = 32
window_sizes = [2, 4, 8, 16, 32]
min_span_length = 2
sweep_pairs_per_step = 128
high_fraction = 0.2
low_k = 20
high_reconstruction_weight = 0.1
rgg_p = 1.0
target_active_fraction = 0.025
target_sigma = 0.0
invariance_weight = 1.0
rdm_weight = 5.0
rdm_projections = 32
rdm_projection_chunk_size = 16
axis_rdm_features = 32
axis_rdm_weight = 1.0
sae_warmup_steps = 5
regularization_ramp_steps = 5

[evaluation]
batch_sequences = 4
max_sequences = 32
probe_questions = 20
probe_tokens_per_question = 10
probe_train_rows = 120
probe_sparsities = [1, 5]
probe_max_iter = 50
probe_tolerance = 0.001
probe_include_dense = true
mmlu_dataset = "cais/mmlu"
mmlu_revision = "c30699e8356da336a370243923dbaf21066bb9fe"
probe_subjects = ["world_religions", "professional_law"]
bootstrap_samples = 100
